设计: '命令行模块主要用来定义项目所产生的命令行工具。


  和其他模块略有不同，它具有main方法，并定义了多个子命令，每个子命令对应一个【方法】。


  关于这个命令行工具，有几个原则：

  1. 如果需要输入多行文本，那就尽量使用yaml文件作为参数输入。

  2. 如果需要输出，使用yaml格式作为输出，允许保存在文件中。

  3. 禁止交互式操作，就是一问一答的模式，如果出现需要交互的情况，就报错，并通过指定额外的参数来解决。

  '
说明: 命令行模块，关联到main.py
