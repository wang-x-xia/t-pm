名称: 管理需求和用户故事
说明: 开发一个功能，用于管理需求和用户故事，包括创建、编辑和关联需求与用户故事。

流程:
  1. 用户创建需求
  2. 用户为需求创建用户故事
  3. 用户关联需求和用户故事
  4. 系统保存需求和用户故事信息
  5. 系统返回管理结果
背景: |
  我可以管理我的【需求】和【用户故事】，用来描述产品的功能需求和用户场景。
  需求和用户故事的管理有助于团队成员理解产品的功能和用户需求。
需求:
  - 我希望方便的管理这些【需求】和【用户故事】，确保信息的完整性和可追踪性。
  - 我希望能够将需求和用户故事与其他管理元素（如概念、背景等）关联起来。
用户故事:
  - 创建和管理需求
  - 创建和管理用户故事
  - 需求和用户故事关联
