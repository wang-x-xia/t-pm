名称: 流程
说明: 定义了一个【用户故事】的具体行为。
类别:
  - 产品侧
  - 开发侧
详情: |
  【流程】是产品侧和开发侧交界的概念，更贴近验收指标的概念。
  它定义了产品在某个场景下，可以进行什么操作，并最终达到什么效果。

  它的元素非常固定：
  在某个【背景】下，当提供了某些【输入】时，经过了一个【方法】，最终产生了某些【结果】。

  一问一答：
    目前为止，所有的【流程】都是一问一答的。在【流程】自己的定义下，它不会被拆分成多个“子流程”。
    这意味着，对于一个多步骤【用户故事】，需要良好定义其每一个【流程】。

    这实际上是一种对于人类理解的简化，避免了在【流程】中引入复杂的控制流和分支逻辑。
