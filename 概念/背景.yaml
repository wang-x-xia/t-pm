名称: 背景
说明: 定义了一个【流程】中，不变的因素。
类别:
  - 产品侧
  - 开发侧
详情: |
  【背景】是一个【流程】中，贯穿始终的约束。

  【背景】的模糊性：
    【背景】是一个没有那么精准的概念。它只是囫囵地避免了穷举所有【流程】而产生的简化类别。
    例如：网络的波动，服务器的故障，数据库的迁移等，都属于【背景】，那如果穷举所有的【背景】，会导致【流程】的复杂程度指数级增加。

    所以，我们通常也会定义和使用一些通用的【背景】，例如【背景：系统正常】。

    如果有特殊的【背景】，则需要根据【用户故事】的需求，判断是否在【流程】中进行特殊的处理。
    例如：一个HTTP网关的【模块】，其【背景：系统正常】下，就是正常的转发请求到服务。但是，可能存在一些特殊情况，例如：【背景：请求正常】。
    某些【用户故事】下，如果需要特殊处理【背景：请求正常】下的情况，就需要定义特殊的【流程】。
    而其他不需要感知的【用户故事】就会使用默认的超时【流程】。
