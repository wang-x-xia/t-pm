名称: 状态
说明: 描述概念所处的当前阶段或条件。
类别:
  - 状态
关联概念:
  - 方法
  - 需求
  - 用户故事
  - 流程
详情: |
  【状态】用于描述概念所处的当前阶段或条件。
  
  状态类型：
  - 待处理：尚未开始处理
  - 进行中：正在处理
  - 已完成：处理完成
  - 已取消：处理被取消
  - 已暂停：处理暂停
  - 已失败：处理失败
  
  状态与概念的关系：
  - 状态可以应用于各种概念
  - 常见应用于方法、需求、用户故事、流程等
  - 状态帮助跟踪和管理概念的生命周期
  
  状态转换：
  - 状态之间可以有转换关系
  - 例如：待处理 -> 进行中 -> 已完成
  - 例如：进行中 -> 已失败 -> 待处理
  
  状态的管理：
  - 明确的状态定义有助于流程标准化
  - 状态转换应该有明确的触发条件
  - 状态变更应该被记录和追踪

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 状态的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 状态的简要描述
  - 字段: 类型
    类型: 枚举
    必填: true
    枚举值:
      - 待处理
      - 进行中
      - 已完成
      - 已取消
      - 已暂停
      - 已失败
    说明: 状态的类型
  - 字段: 关联概念
    类型: 列表
    必填: false
    说明: 具有该状态的概念列表
  - 字段: 下一状态列表
    类型: 列表
    必填: false
    说明: 该状态可以转换到的下一状态
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对状态的详细说明，包括转换条件等
