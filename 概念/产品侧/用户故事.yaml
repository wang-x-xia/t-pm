名称: 用户故事
说明: 经过产品经理分析的，使用了【概念】来描述的，确定性比较强的需求描述。
类别:
  - 产品侧
关联概念:
  - 需求
  - 流程
  - 背景
详情: |
  【用户故事】是比需求更加精确的需求描述文档。
  
  由于需求的模糊性，对于软件而言，用户故事是更精确的描述产品的文档。
  通过需求相关的概念，定义确切的用户故事。
  
  一般而言，用户故事反映一系列实际的功能，并基于这些功能拆解出多个流程。
  
  流程包含标准流程和非标准流程，即正常情况和异常情况。
  
  用户故事与流程的关系：
  - 一个用户故事可以包含多个流程
  - 流程是用户故事的具体行为描述
  - 流程依赖于背景条件

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 用户故事的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 用户故事的简要描述
  - 字段: 关联需求
    类型: 字符串
    必填: true
    说明: 该用户故事所属的需求名称
  - 字段: 流程列表
    类型: 列表
    必填: false
    说明: 该用户故事包含的所有流程
  - 字段: 背景
    类型: 字符串
    必填: false
    说明: 该用户故事默认的背景条件
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对用户故事的详细说明
