名称: 背景
说明: 定义了一个【流程】中，不变的因素。
类别:
  - 产品侧
  - 流程侧
关联概念:
  - 流程
  - 用户故事
详情: |
  【背景】是流程中贯穿始终的约束条件。
  
  背景的模糊性：
  - 背景是用于避免穷举所有流程而产生的简化类别
  - 例如：网络波动、服务器故障、数据库迁移等都属于背景
  - 如果穷举所有背景，会导致流程的复杂程度指数级增加
  
  常用背景：
  - 系统正常：默认背景，表示一切正常
  - 请求正常：请求相关场景的默认背景
  - 网络异常：网络故障场景
  - 服务不可用：服务故障场景
  
  特殊背景的处理：
  - 如果有特殊的背景，需要根据用户故事的需求判断是否需要特殊处理
  - 其他不需要感知特殊背景的用户故事会使用默认的超时流程

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 背景的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 背景的简要描述
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对背景的详细说明和使用场景
