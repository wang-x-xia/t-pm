名称: 业务概念
说明: 产品中实际业务相关的专有词汇和术语。
类别:
  - 产品侧
关联概念:
  - 概念
详情: |
  【业务概念】是产品中用于描述具体业务领域的概念，与元概念（描述概念本身的概念）相对。
  
  业务概念的作用：
  - 描述产品中的专有词汇
  - 统一团队对术语的理解
  - 避免不同人对同一词汇的不同理解
  
  业务概念的管理：
  - 可以创建和管理业务概念
  - 可以对业务概念进行特殊标记
  - 可以防止重复的业务概念
  
  业务概念与元概念的关系：
  - 元概念（概念）用于描述业务概念
  - 业务概念继承元概念的基本结构
  - 业务概念可以有自己的特殊属性和标记

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 业务概念的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 业务概念的简要描述
  - 字段: 类型
    类型: 字符串
    必填: false
    说明: 业务概念的类型，如实体、事件、规则等
  - 字段: 标记
    类型: 列表
    必填: false
    说明: 该业务概念上的所有标记
  - 字段: 关联概念
    类型: 列表
    必填: false
    说明: 与该业务概念相关的其他概念
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对业务概念的详细说明
