名称: 产品
说明: 代表一个完整的软件产品或项目。
类别:
  - 产品侧
关联概念:
  - 需求
  - 用户故事
详情: |
  【产品】是产品管理系统中最高层级的概念，代表一个完整的软件产品或项目。
  
  一个产品包含多个需求，通过需求的不断累积和完善，产品功能逐渐丰富。
  
  产品与需求的关系：
  - 产品拥有需求列表
  - 需求属于某个产品
  - 需求的变化可能影响产品形态

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 产品的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 产品的简要描述
  - 字段: 需求列表
    类型: 列表
    必填: false
    说明: 属于该产品的所有需求名称
  - 字段: 用户故事列表
    类型: 列表
    必填: false
    说明: 属于该产品的所有用户故事名称
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对产品的详细说明
