名称: 需求
说明: 定义产品的、模糊的、描述性的文档。
类别:
  - 产品侧
关联概念:
  - 产品
  - 用户故事
  - 背景
详情: |
  【需求】是一个描述产品的文档，通常由用户提供基本信息，产品经理进行整理。
  
  需求的特性：
  - 模糊性：需求是描述性的，不是精确的实现细节
  - 渐进性：需求文档是逐渐创建的
  - 稳定性：需求本身极少更改，变更需要非常慎重
  
  需求变更的处理：
  - 需求变更可能对产品形态有极大影响
  - 不应作为正常流程来处理
  - 需要在未来单独考虑需求变更的机制
  
  产品和需求的关系：
  - 随着大量需求的创建，产品逐渐有了完善的功能
  - 产品本身一定携带了没有被需求描述的能力

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 需求的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 需求的简要描述
  - 字段: 背景
    类型: 字符串
    必填: false
    说明: 需求的背景信息
  - 字段: 用户故事列表
    类型: 列表
    必填: false
    说明: 该需求关联的所有用户故事
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对需求的详细说明
