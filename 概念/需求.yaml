名称: 需求
说明: 定义产品的、模糊的、描述性的文档。
类别:
  - 产品侧
详情: |
  需求，是一个描述产品的文档。
  它通常由用户提供基本的信息，并且由产品经理进行一些简要的整理。
  这里的整理指的是更多是全面的描述，而不是定义如何实现。
  因此，需求文档是逐渐创建的，本身极少更改的。

  需求变更：
  需要在未来考虑需求变更。
  对于历史的需求文档的更新需要非常慎重，我们往往只验证，除非确认了某个需求一定要进行变更。
  这里不是阻止变更需求，而是说变更了需求可能对产品形态有极大的影响，因此不应作为正常流程来处理。

  产品和需求的关系：
  随着大量需求的创建，一个产品才逐渐有了完善的功能。
  但是，产品本身一定携带了没有被需求描述的能力。
