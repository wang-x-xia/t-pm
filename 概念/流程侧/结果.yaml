名称: 结果
说明: 流程执行后产生的具体结果
类别:
  - 流程侧
关联概念:
  - 流程
  - 结果类型
  - 概念
详情: |
  【结果】描述了流程执行后的具体产出。
  
  一个流程可能产生多个结果，每个结果都是结构化的。
  
  结果的结构：
  - 类型：属于哪种结果类型
  - 目标：涉及的概念
  - 操作：对目标概念执行的操作
  - 状态变更：状态的变化（如果是状态变更类型）
  - 返回值：具体的返回值（如果是返回结果类型）
  - 描述：结果的详细说明
  
  结果与流程的关系：
  - 一个流程可以包含多个结果
  - 结果描述了流程的执行效果
  - 结果可以用于验证流程是否符合预期

结构:
  - 字段: 类型
    类型: 字符串
    必填: true
    说明: 结果类型，如存储、检查、状态变更、返回、错误
  - 字段: 目标概念
    类型: 字符串
    必填: false
    说明: 结果涉及的概念名称
  - 字段: 操作
    类型: 枚举
    必填: false
    枚举值:
      - 创建
      - 更新
      - 删除
      - 查询
      - 检查
      - 验证
      - 返回
      - 状态变更
    说明: 对目标概念的操作
  - 字段: 原状态
    类型: 字符串
    必填: false
    说明: 变更前的状态（适用于状态变更）
  - 字段: 新状态
    类型: 字符串
    必填: false
    说明: 变更后的状态（适用于状态变更）
  - 字段: 返回值
    类型: 字符串
    必填: false
    说明: 具体的返回值（适用于返回结果）
  - 字段: 描述
    类型: 字符串
    必填: false
    说明: 结果的详细描述
