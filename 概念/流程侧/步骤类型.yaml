名称: 步骤类型
说明: 定义了步骤的分类和基本类型。
类别:
  - 流程侧
关联概念:
  - 步骤
详情: |
  【步骤类型】用于对步骤进行分类，定义步骤的基本行为模式。
  
  常见的步骤类型：
  - 输入：接收用户输入或外部数据
  - 验证：检查输入或状态的合法性
  - 处理：对数据进行处理和计算
  - 保存：将数据持久化
  - 查询：检索数据
  - 返回：返回结果给调用方
  - 错误处理：处理异常情况
  - 条件判断：根据条件选择分支
  
  步骤类型的作用：
  - 统一步骤的命名规范
  - 帮助理解步骤的意图
  - 便于流程的标准化

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 步骤类型的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 步骤类型的简要描述
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对步骤类型的详细说明和使用场景
