名称: 条件
说明: 用于在流程中表示条件判断的结构。
类别:
  - 流程侧
关联概念:
  - 流程
  - 步骤
详情: |
  【条件】用于在流程中表示条件判断，是DSL的一部分。
  
  条件的基本结构：
  - 条件表达式：定义判断条件
  - 然后分支：条件为真时执行的步骤
  - 否则分支：条件为假时执行的步骤
  
  条件表达式支持的操作符：
  - 等于：==
  - 不等于：!=
  - 大于：>
  - 小于：<
  - 大于等于：>=
  - 小于等于：<=
  - 包含：in
  - 不包含：not in
  - 是：is
  - 不是：is not
  
  条件可以嵌套，形成复杂的判断逻辑。

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 条件的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 条件的简要描述
  - 字段: 左值
    类型: 字符串
    必填: true
    说明: 条件的左操作数
  - 字段: 操作符
    类型: 字符串
    必填: true
    说明: 条件的操作符
  - 字段: 右值
    类型: 字符串
    必填: true
    说明: 条件的右操作数
  - 字段: 然后分支
    类型: 列表
    必填: true
    说明: 条件为真时执行的步骤列表
  - 字段: 否则分支
    类型: 列表
    必填: false
    说明: 条件为假时执行的步骤列表
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对条件的详细说明
