名称: 结果类型
说明: 流程执行后可能产生的结果类型分类
类别:
  - 流程侧
关联概念:
  - 流程
  - 结果
详情: |
  【结果类型】用于分类流程执行后产生的结果。
  
  主要结果类型：
  - 存储结果：存储或更新了某个概念
  - 检查结果：检查或验证了某个条件
  - 状态变更：某个概念的状态发生了变化
  - 返回结果：返回了某个值或状态
  - 错误结果：流程执行失败

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 结果类型的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 结果类型的简要描述
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对结果类型的详细说明
