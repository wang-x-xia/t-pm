名称: 流程
说明: 定义了一个【用户故事】的具体行为，使用DSL表达。
类别:
  - 流程侧
关联概念:
  - 用户故事
  - 背景
  - 步骤
  - 方法
  - 结果
  - 结果类型
详情: |
  【流程】是产品侧和开发侧交界的概念，更贴近验收指标的概念。
  
  流程的基本结构：
  - 在某个背景下
  - 当提供了某些输入时
  - 经过了某些方法
  - 最终产生了某些结果
  
  一个流程可能产生多个结果，每个结果都是结构化的。
  
  流程使用DSL来表达，支持以下类型：
  - 顺序：按步骤顺序执行
  - 条件：根据条件选择不同路径
  - 循环：重复执行直到满足条件
  - 并行：多个分支同时执行
  
  流程的特点：
  - 一问一答：所有流程都是一问一答的
  - 不会被拆分成多个"子流程"
  - 每个步骤都是人类可理解的基本动作

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 流程的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 流程的简要描述
  - 字段: 类型
    类型: 枚举
    必填: true
    枚举值:
      - 顺序
      - 条件
      - 循环
      - 并行
    说明: 流程的类型
  - 字段: 背景
    类型: 字符串
    必填: true
    说明: 流程执行时的背景条件
  - 字段: 输入
    类型: 列表
    必填: true
    说明: 流程的输入列表
  - 字段: 方法
    类型: 列表
    必填: true
    说明: 流程涉及的方法列表
  - 字段: 结果列表
    类型: 列表
    必填: false
    说明: 流程执行后产生的所有结果
  - 字段: DSL表达式
    类型: 对象
    必填: false
    说明: DSL格式的流程定义
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对流程的详细说明
