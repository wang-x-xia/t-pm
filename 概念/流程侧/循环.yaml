名称: 循环
说明: 用于在流程中表示循环执行的结构。
类别:
  - 流程侧
关联概念:
  - 流程
  - 步骤
详情: |
  【循环】用于在流程中表示重复执行的结构，是DSL的一部分。
  
  循环的类型：
  - 当循环：当条件为真时重复执行
  - 直到循环：直到条件为真时停止执行
  - 计数循环：执行指定次数
  
  循环的基本结构：
  - 循环类型：决定循环的终止方式
  - 条件：循环的终止条件
  - 步骤列表：循环体中执行的步骤
  
  循环的注意事项：
  - 需要确保循环有明确的终止条件
  - 需要防止无限循环
  - 循环体内不应修改循环条件涉及的变量

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 循环的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 循环的简要描述
  - 字段: 类型
    类型: 枚举
    必填: true
    枚举值:
      - 当循环
      - 直到循环
      - 计数循环
    说明: 循环的类型
  - 字段: 条件
    类型: 字符串
    必填: false
    说明: 循环的终止条件
  - 字段: 计数
    类型: 整数
    必填: false
    说明: 计数循环的次数
  - 字段: 步骤列表
    类型: 列表
    必填: true
    说明: 循环体中执行的步骤列表
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对循环的详细说明
