名称: 步骤
说明: 流程中的基本执行单元。
类别:
  - 流程侧
关联概念:
  - 流程
  - 步骤类型
  - 方法
详情: |
  【步骤】是流程中的基本执行单元，代表一个具体的动作或操作。
  
  步骤的特性：
  - 原子性：步骤是最小不可分的执行单元
  - 可理解性：每个步骤都应该能够被人类理解
  - 可组合性：多个步骤可以组合成更复杂的流程
  
  步骤与流程的关系：
  - 流程由多个步骤组成
  - 步骤定义了流程的具体行为
  - 步骤的执行顺序由流程类型决定
  
  步骤与方法的关系：
  - 步骤通常对应一个方法调用
  - 步骤可以引用已定义的方法

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 步骤的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 步骤的简要描述
  - 字段: 类型
    类型: 字符串
    必填: true
    说明: 步骤的类型，如输入、验证、保存、返回等
  - 字段: 动作
    类型: 字符串
    必填: true
    说明: 步骤的具体动作描述
  - 字段: 关联方法
    类型: 字符串
    必填: false
    说明: 该步骤关联的方法名称
  - 字段: 下一跳
    类型: 字符串
    必填: false
    说明: 步骤执行后的下一跳步骤
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对步骤的详细说明
