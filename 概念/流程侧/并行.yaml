名称: 并行
说明: 用于在流程中表示并行执行的结构。
类别:
  - 流程侧
关联概念:
  - 流程
  - 步骤
详情: |
  【并行】用于在流程中表示多个分支同时执行的结构，是DSL的一部分。
  
  并行的基本结构：
  - 分支列表：并行执行的多个分支
  - 同步点：等待所有分支完成的点
  - 聚合方式：如何聚合各分支的结果
  
  并行的特性：
  - 多个分支同时执行，提高效率
  - 所有分支完成后才能继续后续流程
  - 需要处理分支间的依赖关系
  
  并行的应用场景：
  - 同时进行多个独立的检查
  - 同时调用多个不相关的服务
  - 同时处理多个数据源

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 并行的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 并行的简要描述
  - 字段: 分支列表
    类型: 列表
    必填: true
    说明: 并行执行的分支列表，每个分支是一个步骤列表
  - 字段: 同步点
    类型: 字符串
    必填: false
    说明: 等待所有分支完成的同步点描述
  - 字段: 聚合方式
    类型: 字符串
    必填: false
    说明: 如何聚合各分支的结果
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对并行的详细说明
