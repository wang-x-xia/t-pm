名称: 方法
说明: 开发侧所交付的主要概念，用来描述一个具体的功能。
类别:
  - 开发侧
关联概念:
  - 流程
  - 模块
  - 输入
  - 输出
  - 返回值
  - 状态
详情: |
  【方法】是软件系统中最基本的执行单位，也是开发侧交付的核心概念。
  
  方法的理解：
  - 方法就是一个程序，有参数，执行后会产生变化，输出返回值
  - 方法可以调用其他方法，也可以被其他方法调用
  - 调用时需要指定方法的输入，并获得方法的结果
  
  方法与流程的关系：
  - 流程由多个方法组成
  - 流程中的步骤对应一个或多个方法调用
  
  关于面向对象编程的思考：
  - 并不破坏面向对象的封装性
  - 方法本身仍旧可以基于特定的对象进行调用
  - 强调过程但不排除封装
  
  方法的状态：
  - 待处理：尚未开始实现
  - 进行中：正在实现
  - 已完成：已完成实现

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 方法的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 方法的简要描述
  - 字段: 参数列表
    类型: 列表
    必填: false
    说明: 方法的参数定义
  - 字段: 返回值
    类型: 对象
    必填: false
    说明: 方法的返回值定义
  - 字段: 输入
    类型: 列表
    必填: false
    说明: 方法需要的输入
  - 字段: 输出
    类型: 列表
    必填: false
    说明: 方法产生的输出
  - 字段: 状态
    类型: 字符串
    必填: true
    说明: 方法的当前状态
  - 字段: 关联模块
    类型: 字符串
    必填: false
    说明: 该方法所属的模块
  - 字段: 关联流程
    类型: 列表
    必填: false
    说明: 引用该方法的流程列表
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对方法的详细说明
