名称: 参数
说明: 方法被调用时需要接收的变量。
类别:
  - 基础类型
关联概念:
  - 方法
  - 输入
详情: |
  【参数】是方法被调用时需要接收的变量。
  
  参数的特性：
  - 参数是方法接口的一部分
  - 参数有名称、类型和位置
  - 参数可以是必填或可选的
  
  参数的位置：
  - 位置参数：按位置顺序传递
  - 关键字参数：按参数名称传递
  - 混合参数：同时支持位置和关键字
  
  参数的类型：
  - 基本类型：如字符串、整数、布尔等
  - 复杂类型：如列表、字典、对象等
  - 自定义类型：如概念、业务对象等
  
  参数的验证：
  - 类型检查：确保参数类型正确
  - 范围检查：确保参数值在有效范围内
  - 必填检查：确保必填参数已提供
  
  参数与输入的关系：
  - 参数是方法级别的输入
  - 输入可以是参数或外部数据源

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 参数的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 参数的简要描述
  - 字段: 类型
    类型: 字符串
    必填: true
    说明: 参数的数据类型
  - 字段: 位置
    类型: 枚举
    必填: true
    枚举值:
      - 位置参数
      - 关键字参数
      - 混合
    说明: 参数的位置类型
  - 字段: 必填
    类型: 布尔
    必填: true
    说明: 参数是否为必填项
  - 字段: 默认值
    类型: 字符串
    必填: false
    说明: 参数的默认值
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对参数的详细说明，包括取值范围、格式等
