名称: 输出
说明: 流程或方法执行后产生的数据或信息。
类别:
  - 基础类型
关联概念:
  - 流程
  - 方法
  - 返回值
详情: |
  【输出】是流程或方法执行后产生的数据或信息。
  
  输出的特性：
  - 输出是流程或方法执行的结果
  - 输出应该有明确的类型定义
  - 输出可以被后续流程或方法使用
  
  输出的类型：
  - 用户输出：展示给用户的数据
  - 系统输出：供系统内部使用的数据
  - 外部输出：发送给外部系统的数据
  - 文件输出：写入文件的数据
  
  输出与结果的区别：
  - 结果是流程级别的输出
  - 输出是方法级别的产物
  - 一个流程可能包含多个方法的输出
  
  输出与返回值的关系：
  - 返回值是方法级别的输出
  - 输出可以包含返回值和其他副作用

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 输出的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 输出的简要描述
  - 字段: 类型
    类型: 字符串
    必填: true
    说明: 输出的数据类型
  - 字段: 格式
    类型: 字符串
    必填: false
    说明: 输出的格式描述
  - 字段: 关联方法
    类型: 列表
    必填: false
    说明: 产生该输出的方法列表
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对输出的详细说明
