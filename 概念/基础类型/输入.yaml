名称: 输入
说明: 流程或方法需要接收的数据或信息。
类别:
  - 基础类型
关联概念:
  - 流程
  - 方法
  - 参数
详情: |
  【输入】是流程或方法需要接收的数据或信息。
  
  输入的特性：
  - 输入是执行流程或方法的前提条件
  - 输入应该有明确的类型定义
  - 输入可以是必填或可选的
  
  输入的类型：
  - 用户输入：由用户直接提供的数据
  - 系统输入：由系统自动提供的数据
  - 外部输入：由外部系统提供的数据
  - 文件输入：从文件读取的数据
  
  输入的验证：
  - 输入应该被验证确保合法性
  - 必填输入缺失应该导致流程失败
  - 可选输入缺失应该使用默认值
  
  输入与流程的关系：
  - 流程有输入
  - 输入是流程执行的前提条件
  - 输入的类型和格式应该明确定义

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 输入的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 输入的简要描述
  - 字段: 类型
    类型: 字符串
    必填: true
    说明: 输入的数据类型
  - 字段: 必填
    类型: 布尔
    必填: true
    说明: 输入是否为必填项
  - 字段: 默认值
    类型: 字符串
    必填: false
    说明: 输入的默认值
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对输入的详细说明，包括格式、取值范围等
