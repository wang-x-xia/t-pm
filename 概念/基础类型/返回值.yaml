名称: 返回值
说明: 方法执行完成后返回给调用方的结果。
类别:
  - 基础类型
关联概念:
  - 方法
  - 输出
详情: |
  【返回值】是方法执行完成后返回给调用方的结果。
  
  返回值的特性：
  - 返回值是方法接口的一部分
  - 返回值有明确的类型定义
  - 返回值表示方法的执行结果
  
  返回值的类型：
  - 成功返回值：表示方法正常执行完成
  - 错误返回值：表示方法执行失败
  - 混合返回值：同时包含成功信息和结果数据
  
  返回值与结果的关系：
  - 返回值是方法级别的返回
  - 结果是流程级别的返回
  - 流程的结果可能包含多个方法的返回值
  
  返回值的设计原则：
  - 明确返回值的含义
  - 统一返回值的格式
  - 区分成功和失败情况
  
  返回值与输出的关系：
  - 返回值是一种特殊的输出
  - 输出可以是返回值或其他副作用

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 返回值的名称
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 返回值的简要描述
  - 字段: 类型
    类型: 字符串
    必填: true
    说明: 返回值的数据类型
  - 字段: 成功值
    类型: 字符串
    必填: false
    说明: 表示成功的返回值
  - 字段: 错误值
    类型: 字符串
    必填: false
    说明: 表示错误的返回值
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对返回值的详细说明
