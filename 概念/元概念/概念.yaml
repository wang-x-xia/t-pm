名称: 概念
说明: 用于描述产品中所有相关概念的元概念。
类别:
  - 元概念
关联概念:
  - 产品
  - 需求
  - 用户故事
  - 背景
  - 流程
  - 步骤
  - 方法
  - 模块
  - 状态
详情: |
  【概念】是产品管理系统中最基本的元素，用于描述产品中的任何相关概念。
  它是"关于概念的概念"，即元概念。
  
  每个概念都应该有：
  - 名称：概念的标识
  - 说明：概念的简要描述
  - 类别：概念所属的类别
  - 关联概念：与该概念相关的其他概念
  - 详情：对概念的详细说明
  
  概念之间的关系包括：
  - 关联：两个概念存在某种联系
  - 依赖：一个概念依赖另一个概念
  - 组成：一个概念由另一个概念组成
  - 继承：一个概念继承自另一个概念
  - 引用：一个概念引用了另一个概念
  - 聚合：一个概念包含了另一个概念
  - 标记：用标记来描述概念的属性

结构:
  - 字段: 名称
    类型: 字符串
    必填: true
    说明: 概念的名称，用于唯一标识概念
  - 字段: 说明
    类型: 字符串
    必填: true
    说明: 概念的简要描述
  - 字段: 类别
    类型: 列表
    必填: true
    说明: 概念所属的类别，如产品侧、开发侧、元概念等
  - 字段: 关联概念
    类型: 列表
    必填: false
    说明: 与该概念相关的其他概念列表
  - 字段: 详情
    类型: 字符串
    必填: false
    说明: 对概念的详细说明和使用场景
  - 字段: 结构
    类型: 列表
    必填: false
    说明: 概念的数据结构定义
